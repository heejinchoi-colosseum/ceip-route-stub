server:
  port: 8080

spring:
  config:
    # IDE 로 켜도 env.sh 와 같은 값을 읽도록 프로젝트 루트의 .env(gitignore) 를 가져온다.
    # 모듈 작업 디렉터리(callback-cgs/)에서 켜면 ../.env 가 잡힌다. 환경변수가 있으면 그쪽이 우선한다.
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  application:
    name: ceip-route-stub
  web:
    resources:
      cache:
        cachecontrol:
          # 테스트 폼(index.html)이 브라우저에 캐시돼 예전 체크박스가 보이는 일을 막는다.
          no-store: true

shopify:
  api-key: ${SHOPIFY_API_KEY:}
  api-secret: ${SHOPIFY_API_SECRET:}
  app-host: ${APP_HOST:https://ceip-router.ngrok-free.app}
  # 콜백(redirect_uri) 호스트. App URL 과 다른 호스트로 두어 검증한다. 미설정 시 app-host 로 폴백한다.
  callback-host: ${CALLBACK_HOST:${APP_HOST:https://ceip-router.ngrok-free.app}}
  # 서비스별 콜백 호스트. start 가 service 로 switch 해 redirect_uri 를 다르게 만든다. 각각 Shopify 앱의
  # Allowed redirection URL(s) 에 등록돼 있어야 한다. 미설정 시 callback-host 로 폴백해 셋이 같아진다.
  callback-host-cgs: ${CALLBACK_HOST_CGS:}
  callback-host-colo1: ${CALLBACK_HOST_COLO1:}
  callback-host-colo-nova: ${CALLBACK_HOST_COLO_NOVA:}
  # 개인정보 웹훅 3종(customers/data_request, customers/redact, shop/redact)의 접수 담당 service. 이 세 topic 은
  # Dev Dashboard 의 Compliance webhooks 에 앱당 주소 하나만 두므로 쿼리에 service 를 실을 수 없다. 릴레이가 이 값으로 전달처를 고른다.
  compliance-service: ${COMPLIANCE_SERVICE:cgs}
  scopes: ${SHOPIFY_SCOPES:read_assigned_fulfillment_orders,read_fulfillments,read_merchant_managed_fulfillment_orders,read_orders,read_third_party_fulfillment_orders,write_assigned_fulfillment_orders,write_fulfillments,write_merchant_managed_fulfillment_orders,write_orders,write_third_party_fulfillment_orders,read_products,read_inventory,write_inventory,read_locations}
  # 절대 URL returnTo 로 복귀를 허용할 호스트(콤마 구분). 상대 경로(/...)는 같은 호스트라 항상 허용.
  return-allowlist: ${SHOPIFY_RETURN_ALLOWLIST:}

# Cafe24 앱. Redirect URI(s) 에는 라우터 콜백 {app-host}/oauth/cafe24/default/callback 하나만 등록한다.
# 라우터 콜백이 state 의 service 로 위 shopify.callback-host* 의 서비스 콜백에 넘긴다(같은 소비 서비스 앱, 같은 터널).
cafe24:
  client-id: ${CAFE24_CLIENT_ID:}
  client-secret: ${CAFE24_CLIENT_SECRET:}
  # 앱 권한 설정에 등록한 scope 안에서만 요청할 수 있다(콤마 구분, authorize 에는 공백으로 보낸다).
  scopes: ${CAFE24_SCOPES:mall.read_application,mall.write_application,mall.read_order,mall.write_order,mall.read_product,mall.read_store}
  # 개발자센터 WebHook "인증정보". 웹훅 X-API-Key 헤더와 비교한다(Cafe24 웹훅에는 HMAC 서명이 없다).
  webhook-key: ${CAFE24_WEBHOOK_KEY:}

logging:
  level:
    com.colosseum.routestub: DEBUG
